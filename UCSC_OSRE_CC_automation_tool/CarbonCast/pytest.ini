[tool:pytest]
# Pytest configuration for RDA Automation System

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version requirements
minversion = 6.0

# Add options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --durations=10

# Test markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for system workflows
    slow: Tests that take a long time to run
    requires_db: Tests that require database setup
    requires_network: Tests that require network access
    smoke: Quick smoke tests for basic functionality

# Filtering options
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage options (when using pytest-cov)
# Uncomment these lines if you want default coverage settings
# addopts = --cov=src/python --cov-report=html --cov-report=term-missing
# [coverage:run]
# source = src/python
# omit = 
#     */tests/*
#     */test_*
#     */__pycache__/*
#     */venv/*
#     */env/*

# Test timeout (requires pytest-timeout)
timeout = 300
timeout_method = thread

# Parallel execution (requires pytest-xdist)
# Uncomment to enable parallel test execution
# addopts = -n auto

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Disable cacheprovider warnings
cache_dir = .pytest_cache